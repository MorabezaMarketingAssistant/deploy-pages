<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deploy Pages</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a31;
      --text: #eef2ff;
      --muted: #b8c0e0;
      --accent: #7dd3fc;
      --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(180deg, #0b1020, #101935 60%, #0b1020);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .wrap {
      width: min(860px, 100%);
      background: rgba(18,26,49,.9);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3rem); }
    p { color: var(--muted); line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-top: 28px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: rgba(125,211,252,.5);
      background: rgba(125,211,252,.06);
    }
    .label { font-size: .8rem; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
    .title { font-size: 1.2rem; font-weight: 700; margin-top: 8px; }
    .url { margin-top: 8px; font-size: .92rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Deploy Pages</h1>
    <p>Published pages in this repository. Each page lives in its own folder so new deployments do not overwrite existing ones.</p>
    <section class="grid">
      <a class="card" href="./keto-be-nl/">
        <div class="label">Landing page</div>
        <div class="title">Keto 4-Wekenplan</div>
        <div class="url">/deploy-pages/keto-be-nl/</div>
      </a>
      <a class="card" href="./marketing-plan-monte-madeiral/">
        <div class="label">Client page</div>
        <div class="title">Monte Madeiral — Marketing Plan</div>
        <div class="url">/deploy-pages/marketing-plan-monte-madeiral/</div>
      </a>
    </section>
  </main>
</body>
</html>
